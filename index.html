<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bora Bora — доставка еды в Солнечнодольске</title>
<meta name="description" content="Доставка пиццы 30 см и закусок из ресторана Bora Bora в Солнечнодольске. Заказ онлайн за пару минут.">
<meta name="theme-color" content="#fdf4ef">
<link rel="icon" href="img/logo.png">
<link rel="apple-touch-icon" href="img/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Bora Bora">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>

:root {
  --cream:   #fdf4ef;
  --cream2:  #f8e9e3;
  --palm:    #e3a8c2;
  --pink:    #c14d77;
  --pink2:   #a8345f;
  --ink:     #3a2630;
  --ink-soft:#8a6b78;
  --line:    rgba(193,77,119,.14);
  --ok:      #3f9d6d;
  --shadow:  0 6px 22px rgba(140,60,90,.1), 0 0 0 1px rgba(193,77,119,.06);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
img { display:block; }
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 84px;
}
body.locked { overflow: hidden; }

/* Сайт только под телефон: контент всегда в мобильной колонке */
.wrap { max-width: 480px; margin: 0 auto; }

/* ══════════════ ФОНОВЫЕ ПАЛЬМЫ ══════════════ */
#bg-palms {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 0%, #fef8f5 0%, var(--cream) 45%, var(--cream2) 100%);
}
#bg-palms svg { position: absolute; width: 300px; opacity: .14; }
.bgp-tl { top:-50px;  left:-70px;   transform: rotate(-12deg); }
.bgp-tr { top:-50px;  right:-70px;  transform: rotate(12deg) scaleX(-1); }
.bgp-ml { top:38%;    left:-110px;  transform: rotate(8deg);  opacity:.09 !important; }
.bgp-mr { top:58%;    right:-110px; transform: rotate(-8deg) scaleX(-1); opacity:.09 !important; }
.bgp-bl { bottom:-60px; left:-70px;  transform: rotate(10deg); }
.bgp-br { bottom:-60px; right:-70px; transform: rotate(-10deg) scaleX(-1); }

header, main, footer, .nav-wrap, .search-wrap, .info { position: relative; z-index: 1; }

/* ══════════════ ШАПКА ══════════════ */
.topbar {
  position: sticky; top: 0; z-index: 90;
  background: rgba(253,244,239,.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
}
.brand { display: flex; align-items: center; gap: 9px; margin-right: auto; }
.brand-logo { width: 38px; height: 38px; flex-shrink: 0; }
.brand-txt { display: flex; flex-direction: column; line-height: 1; }
.brand-name {
  font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700;
  font-size: 22px; color: var(--pink); letter-spacing: -.5px;
}
.brand-sub {
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--ink-soft); margin-top: 3px;
}
.icon-btn {
  position: relative; flex-shrink: 0;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(255,255,255,.7);
  display: grid; place-items: center; font-size: 17px;
  cursor: pointer; transition: transform .15s, background .2s; text-decoration: none;
}
.icon-btn:active { transform: scale(.92); }
.icon-btn .dot {
  position: absolute; top: -3px; right: -3px;
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
  background: linear-gradient(135deg, var(--pink), var(--pink2)); color: #fff;
  font-size: 10px; font-weight: 800; display: grid; place-items: center;
  box-shadow: 0 2px 8px rgba(168,52,95,.5);
  transform: scale(0); transition: transform .25s cubic-bezier(.2,1.4,.5,1);
}
.icon-btn .dot.on { transform: scale(1); }

/* ══════════════ HERO ══════════════ */
.hero { padding: 0 16px 18px; text-align: center; }

.hero-banner {
  position: relative; height: 210px;
  margin: 0 -16px;
  overflow: hidden;
}
.hero-banner img {
  width: 100%; height: 100%; object-fit: cover;
  animation: heroZoom 14s ease-out forwards;
}
@keyframes heroZoom { from { transform: scale(1.1) } to { transform: scale(1) } }
.hero-fade {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    rgba(253,244,239,0) 30%,
    rgba(253,244,239,.55) 62%,
    rgba(253,244,239,.92) 85%,
    var(--cream) 100%);
}

.hero-logo {
  position: relative; z-index: 2;
  display: block; width: 108px; height: 108px;
  margin: -62px auto 12px;
  filter: drop-shadow(0 8px 22px rgba(140,60,90,.3));
  animation: logoIn .8s cubic-bezier(.2,1.3,.4,1) .15s backwards;
}
@keyframes logoIn { from { opacity: 0; transform: translateY(14px) scale(.85) } }

.hero-title {
  font-family: 'Playfair Display', Georgia, serif; font-size: 25px; font-weight: 400;
  letter-spacing: .5px; line-height: 1.3; margin-bottom: 9px;
}
.hero-title i { font-style: italic; color: var(--pink); font-weight: 700; }
.hero-line { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }

.badges {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-top: 16px;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.75); border: 1px solid var(--line);
  border-radius: 40px; padding: 7px 14px;
  font-size: 11px; font-weight: 600; color: var(--ink);
}
.badge b { color: var(--pink); }

.status {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 14px; padding: 7px 15px; border-radius: 40px;
  font-size: 11.5px; font-weight: 600;
}
.status.open  { background: rgba(63,157,109,.12); color: var(--ok); }
.status.shut  { background: rgba(193,77,119,.12); color: var(--pink2); }
.status .led { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.open .led { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ══════════════ ПОИСК ══════════════ */
.search-wrap { padding: 4px 14px 0; }
.search {
  display: flex; align-items: center; gap: 9px;
  background: rgba(255,255,255,.8); border: 1px solid var(--line);
  border-radius: 14px; padding: 11px 14px;
}
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 14px; }
.search input::placeholder { color: var(--ink-soft); }
.search .clear { display: none; border: 0; background: none; color: var(--ink-soft); cursor: pointer; font-size: 16px; }
.search .clear.on { display: block; }

/* ══════════════ КАТЕГОРИИ ══════════════ */
.nav-wrap {
  position: sticky; top: 60px; z-index: 80;
  background: rgba(253,244,239,.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  margin-top: 12px;
}
.nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.pill {
  flex-shrink: 0; padding: 8px 15px; border-radius: 50px;
  border: 1px solid rgba(193,77,119,.25);
  background: rgba(255,255,255,.6); color: var(--ink-soft);
  font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: all .2s;
}
.pill.active {
  background: linear-gradient(135deg, var(--pink), var(--pink2));
  color: #fff; border-color: transparent;
  box-shadow: 0 3px 14px rgba(193,77,119,.35);
}

/* ══════════════ СЕКЦИИ И КАРТОЧКИ ══════════════ */
.section { scroll-margin-top: 112px; }
.sec-head { padding: 26px 14px 12px; text-align: center; }
.sec-box {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--pink), var(--pink2));
  color: #fff; padding: 8px 22px; border-radius: 30px;
  font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  box-shadow: 0 4px 16px rgba(193,77,119,.28);
}

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; padding: 0 12px; }

.card {
  position: relative; display: flex; flex-direction: column;
  overflow: hidden; border-radius: 18px; background: #fff;
  box-shadow: var(--shadow);
  opacity: 0; transform: translateY(26px);
  transition: opacity .55s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.2,.7,.2,1);
}
.card.in { opacity: 1; transform: none; }
.card.hide { display: none; }
.card.wide { grid-column: 1 / -1; }
.card.inCart { box-shadow: 0 6px 22px rgba(193,77,119,.2), 0 0 0 2px var(--pink); }

.card-media { position: relative; cursor: pointer; }
.card-img {
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  background: linear-gradient(135deg, var(--cream2), #f3d9e2);
  opacity: 0; transition: opacity .45s ease;
}
.card-img.loaded { opacity: 1; }
.card.wide .card-img { aspect-ratio: 16/8; }
.card-icon {
  display: grid; place-items: center; width: 100%; aspect-ratio: 4/3; font-size: 52px;
  background: linear-gradient(135deg, var(--cream2), #f3d9e2);
}
.card.wide .card-icon { aspect-ratio: 16/8; }

.card-badge {
  position: absolute; top: 10px; left: 10px;
  background: linear-gradient(135deg, var(--pink), var(--pink2)); color: #fff;
  font-size: 8.5px; font-weight: 700; letter-spacing: 1px; padding: 4px 10px;
  border-radius: 20px; text-transform: uppercase;
  box-shadow: 0 3px 12px rgba(168,52,95,.45);
}

.card-body { padding: 11px 12px 13px; display: flex; flex-direction: column; flex: 1; }
.card-name { font-size: 13.5px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
.card.wide .card-name { font-size: 16px; }
.card-desc {
  font-size: 10.5px; color: var(--ink-soft); line-height: 1.45; margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card.wide .card-desc { -webkit-line-clamp: 3; }
.card-weight {
  align-self: flex-start; font-size: 9px; color: var(--ink-soft);
  background: var(--cream2); padding: 3px 9px; border-radius: 10px; margin-bottom: 9px;
}
.card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-price { font-size: 17px; font-weight: 900; color: var(--pink); letter-spacing: -.4px; white-space: nowrap; }
.card.wide .card-price { font-size: 22px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.card-tag {
  font-size: 8.5px; font-weight: 700; letter-spacing: .3px;
  padding: 3px 8px; border-radius: 10px;
  background: rgba(227,168,194,.22); color: var(--pink2);
}
.card.wide .card-tag { font-size: 9.5px; padding: 4px 10px; }

/* ── КНОПКА «НАВЕРХ» ── */
#toTop {
  position: fixed; right: 14px; bottom: 96px; z-index: 88;
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: rgba(253,244,239,.92); backdrop-filter: blur(10px);
  color: var(--pink); font-size: 18px; cursor: pointer;
  box-shadow: 0 6px 20px rgba(140,60,90,.18);
  opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity .25s, transform .25s, visibility .25s;
}
#toTop.on { opacity: 1; visibility: visible; transform: none; }
#toTop:active { transform: scale(.9); }

.card-prices { display: flex; flex-direction: column; line-height: 1.1; }
.card-old {
  font-size: 11px; color: var(--ink-soft); text-decoration: line-through;
  margin-top: 2px;
}
.dish-old { font-size: 14px; color: var(--ink-soft); text-decoration: line-through; margin-left: -6px; }

/* ── ВЫБОР ВНУТРИ КОМБО ── */
.picks { display: grid; gap: 9px; margin-top: 16px; }
.pick label {
  display: block; font-size: 9px; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--ink-soft); margin: 0 0 5px 3px;
}
.pick select {
  width: 100%; border: 1px solid var(--line); background: rgba(255,255,255,.85);
  border-radius: 13px; padding: 12px 14px; font-size: 14px; font-weight: 600;
  outline: none; -webkit-appearance: none; appearance: none;
}
.pick select:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(193,77,119,.12); }
.line-pick {
  display: inline-block; margin-top: 4px; padding: 0; border: 0; background: none;
  font-size: 10.5px; line-height: 1.35; text-align: left; cursor: pointer;
  color: var(--pink2); text-decoration: underline; text-underline-offset: 2px;
  text-decoration-color: rgba(168,52,95,.35);
}
.line-pick:active { opacity: .6; }

/* ── ПЛЮСИК / СТЕППЕР ── */
.add {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: 13px;
  border: 0; cursor: pointer;
  background: linear-gradient(135deg, var(--pink), var(--pink2)); color: #fff;
  font-size: 22px; font-weight: 300; line-height: 1;
  display: grid; place-items: center;
  box-shadow: 0 4px 14px rgba(193,77,119,.35);
  transition: transform .15s;
}
.add:active { transform: scale(.88); }

.stepper {
  flex-shrink: 0; display: flex; align-items: center; gap: 2px;
  background: linear-gradient(135deg, var(--pink), var(--pink2));
  border-radius: 13px; height: 38px; padding: 0 3px;
  box-shadow: 0 4px 14px rgba(193,77,119,.35);
  animation: popIn .25s cubic-bezier(.2,1.5,.5,1);
}
@keyframes popIn { from { transform: scale(.7); opacity: 0 } to { transform: none; opacity: 1 } }
.stepper button {
  width: 32px; height: 32px; border: 0; background: none; color: #fff;
  font-size: 19px; font-weight: 300; cursor: pointer; border-radius: 10px;
  display: grid; place-items: center;
}
.stepper button:active { background: rgba(0,0,0,.15); }
.stepper .qty { min-width: 20px; text-align: center; color: #fff; font-size: 14px; font-weight: 800; }

.empty-search {
  display: none; text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 14px;
}
.empty-search.on { display: block; }

/* ══════════════ ИНФО-БЛОК ══════════════ */
.info { padding: 26px 14px 6px; }
.info-grid { display: grid; gap: 11px; grid-template-columns: 1fr; }
.info-card {
  background: rgba(255,255,255,.8); border: 1px solid var(--line);
  border-radius: 18px; padding: 18px 18px 19px;
}
.info-card h3 {
  font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--pink); margin-bottom: 11px; font-weight: 800;
}
.info-card p { font-size: 13px; line-height: 1.65; color: var(--ink); }
.info-card p + p { margin-top: 7px; }
.info-card span { color: var(--ink-soft); }
.info-card a { color: var(--pink); font-weight: 700; text-decoration: none; }

/* ══════════════ ФУТЕР ══════════════ */
footer { padding: 22px 20px 26px; text-align: center; }
.footer-logo {
  width: 78px; height: 78px; margin: 0 auto 8px; opacity: .9;
  filter: drop-shadow(0 6px 16px rgba(140,60,90,.18));
}
.footer-flowers { font-size: 14px; letter-spacing: 8px; opacity: .45; margin-bottom: 12px; }

/* ── СОЦСЕТИ ── */
.socials { display: flex; gap: 11px; justify-content: center; margin-bottom: 14px; }
.soc {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; text-decoration: none;
  border: 1px solid var(--line); background: rgba(255,255,255,.75);
  color: var(--pink); transition: transform .15s, background .2s, color .2s;
}
.soc:active { transform: scale(.9); }
.soc:hover { background: linear-gradient(135deg, var(--pink), var(--pink2)); color: #fff; border-color: transparent; }
.soc svg { width: 21px; height: 21px; display: block; }
.footer-text { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); line-height: 2; }

/* ══════════════ НИЖНЯЯ ПЛАШКА КОРЗИНЫ ══════════════ */
.cartbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 95;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  background: rgba(253,244,239,.9);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  transform: translateY(130%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
}
.cartbar.on { transform: none; }
.cartbar-btn {
  width: 100%; max-width: 452px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  border: 0; cursor: pointer; border-radius: 16px; padding: 14px 18px;
  background: linear-gradient(135deg, var(--pink), var(--pink2)); color: #fff;
  box-shadow: 0 8px 26px rgba(193,77,119,.4);
  transition: transform .15s;
}
.cartbar-btn:active { transform: scale(.98); }
.cartbar-btn .t { font-size: 14px; font-weight: 800; letter-spacing: .3px; }
.cartbar-btn .c { font-size: 10.5px; opacity: .85; margin-top: 2px; }
.cartbar-btn .l { text-align: left; margin-right: auto; }
.cartbar-btn .sum { font-size: 17px; font-weight: 900; white-space: nowrap; }

/* ══════════════ ШТОРКА КОРЗИНЫ ══════════════ */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(58,38,48,.45);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s;
}
.overlay.on { opacity: 1; visibility: visible; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
  max-height: 92vh; display: flex; flex-direction: column;
  background: var(--cream);
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -10px 40px rgba(58,38,48,.25);
  transform: translateY(100%); transition: transform .38s cubic-bezier(.2,.8,.2,1);
}
.sheet.on { transform: none; }
@media (min-width: 520px) {
  .sheet { left: 50%; right: auto; width: 480px; transform: translate(-50%, 100%); }
  .sheet.on { transform: translate(-50%, 0); }
}

.sheet-head {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px 12px; border-bottom: 1px solid var(--line);
}
.sheet-head h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 21px; font-weight: 400; margin-right: auto; }
.sheet-head h2 i { font-style: italic; color: var(--pink); }
.sheet-close {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  background: rgba(255,255,255,.7); font-size: 16px; cursor: pointer; color: var(--ink-soft);
}
.grab { width: 40px; height: 4px; border-radius: 3px; background: var(--palm); opacity: .5; margin: 9px auto 0; }

.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 18px 4px; flex: 1; }

.line {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
.line-img { width: 54px; height: 54px; border-radius: 13px; object-fit: cover; flex-shrink: 0; }
.line-icon {
  width: 54px; height: 54px; border-radius: 13px; flex-shrink: 0; font-size: 26px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--cream2), #f3d9e2);
}
.line-txt { flex: 1; min-width: 0; }
.line-name { font-size: 13px; font-weight: 700; line-height: 1.3; }
.line-price { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
.line-sum { font-size: 14px; font-weight: 900; color: var(--pink); white-space: nowrap; }
.line .stepper { height: 32px; box-shadow: none; }
.line .stepper button { width: 27px; height: 27px; font-size: 17px; }
.line .stepper .qty { font-size: 13px; }

.totals { padding: 14px 0 4px; }
.trow { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; color: var(--ink-soft); }
.trow b { color: var(--ink); font-weight: 700; }
.trow.grand { font-size: 17px; padding-top: 11px; margin-top: 7px; border-top: 1px solid var(--line); color: var(--ink); }
.trow.grand b { color: var(--pink); font-size: 21px; font-weight: 900; }
.hint {
  background: rgba(227,168,194,.18); border-radius: 12px;
  padding: 10px 13px; font-size: 11.5px; line-height: 1.5; color: var(--ink);
  margin-top: 10px;
}
.hint b { color: var(--pink2); }
.hint-add {
  display: inline-block; margin-top: 8px; padding: 7px 14px; border: 0; cursor: pointer;
  border-radius: 20px; font-size: 11.5px; font-weight: 800;
  background: linear-gradient(135deg, var(--pink), var(--pink2)); color: #fff;
  box-shadow: 0 3px 12px rgba(193,77,119,.3);
}
.hint-add:active { transform: scale(.94); }

.form { padding: 16px 0 6px; display: grid; gap: 10px; }
.seg { display: flex; gap: 6px; background: rgba(255,255,255,.7); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button {

.field { position: relative; }
.field label {

}
.field input, .field textarea, .field select {

  transition: border-color .2s, box-shadow .2s;

}
.field select { background-image: none; }
.field textarea { resize: none; min-height: 72px; }
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--pink); box-shadow: 0 0 0 3px rgba(193,77,119,.12);
}
.field.err input, .field.err textarea { border-color: #d2394f; box-shadow: 0 0 0 3px rgba(210,57,79,.1); }

/* Плоский список с устойчивыми id */
const ITEMS = {};
MENU.forEach(cat => cat.items.forEach((it, i) => {
  it.id = cat.id + '-' + i;

   КОРЗИНА

const STORE = 'bora-cart-v1';
let cart = {};
try { cart = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { cart = {}; }
Object.keys(cart).forEach(id => { if (!ITEMS[id]) delete cart[id]; });

const save = () => { try { localStorage.setItem(STORE, JSON.stringify(cart)); } catch (e) {} };

/* Выбор внутри комбо: picks[id] = { 'Пицца': 'Пепперони', ... } */
const PICK_STORE = 'bora-picks-v2';
let picks = {};
try { picks = JSON.parse(localStorage.getItem(PICK_STORE)) || {}; } catch (e) { picks = {}; }
const savePicks = () => { try { localStorage.setItem(PICK_STORE, JSON.stringify(picks)); } catch (e) {} };

function pickOf(id) {
  const it = ITEMS[id];
  if (!it || !it.options) return null;
  const cur = picks[id] || {};
  let changed = false;
  it.options.forEach(o => {
    if (!o.values.includes(cur[o.label])) {
      cur[o.label] = (o.def && o.values.includes(o.def)) ? o.def : o.values[0];
      changed = true;
    }
  });
  picks[id] = cur;
  if (changed) savePicks();
  return cur;
}
/* Для заказа администратору — с подписями, чтобы было однозначно */
const pickText = id => {
  const p = pickOf(id);
  return p ? Object.entries(p).map(([k, v]) => `${k}: ${v}`).join(' · ') : '';
};

/* Для корзины — только значения, повторы схлопываем: «Пепперони ×2» */
const pickShort = id => {
  const p = pickOf(id);
  if (!p) return '';
  const out = [];
  Object.values(p).forEach(v => {
    const last = out[out.length - 1];
    if (last && last.v === v) last.n++;
    else out.push({ v, n: 1 });
  });
  return out.map(x => x.n > 1 ? `${x.v} ×${x.n}` : x.v).join(' · ');
};

/* Прошлый отправленный заказ — чтобы повторить в один тап */
const LAST_STORE = 'bora-last-v1';
const saveLast = () => { try { localStorage.setItem(LAST_STORE, JSON.stringify({ items: cart })); } catch (e) {} };
function lastOrder() {
  try {
    const l = JSON.parse(localStorage.getItem(LAST_STORE));
    if (!l || !l.items) return null;
    Object.keys(l.items).forEach(id => { if (!ITEMS[id]) delete l.items[id]; });
    if (!Object.keys(l.items).length) return null;
    l.sum = Object.entries(l.items).reduce((s, [id, q]) => s + ITEMS[id].price * q, 0);
    return l;
  } catch (e) { return null; }
}
const rub  = n => n.toLocaleString('ru-RU') + ' ₽';
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const subtotal = () => Object.entries(cart).reduce((s, [id, q]) => s + ITEMS[id].price * q, 0);
const plural = (n, a, b, c) => {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return a;
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return b;
  return c;
};
const deliveryCost = () => {
  const s = subtotal();
  if (s === 0 || s >= CONFIG.delivery.free) return 0;
  return CONFIG.delivery.price;
};

function setQty(id, q) {
  if (q <= 0) delete cart[id]; else cart[id] = q;
  save();
  paintCard(id);
  paintBar();
  if (sheet.classList.contains('on')) paintSheet();
  if (dishSheet.classList.contains('on') && openDishId === id) paintDish();
}

  setQty(id, (cart[id] || 0) + 1);
  if (navigator.vibrate) navigator.vibrate(12);
  if (from) fly(from); else toast(ITEMS[id].name + ' — в корзине');

/* Картинка блюда улетает в иконку корзины */
function fly(srcEl) {
  const img = srcEl.closest('.card, .sheet')?.querySelector('.card-img, .dish-media img');
  const target = document.getElementById('cartBtn');
  if (!img || !target || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const a = img.getBoundingClientRect(), b = target.getBoundingClientRect();
  const f = document.createElement('img');
  f.src = img.src;
  f.className = 'flyer';
  f.style.cssText += `left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;`;
  document.body.appendChild(f);

  requestAnimationFrame(() => {
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
    const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    f.style.transform = `translate(${dx}px, ${dy}px) scale(.08)`;
    f.style.opacity = '.3';
  });
  setTimeout(() => {
    f.remove();
    target.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }],
      { duration: 340, easing: 'cubic-bezier(.3,1.4,.5,1)' }
    );
  }, 640);
}

function paintCard(id) {
  const card = menuEl.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  const ctl = card.querySelector('.ctl');
  const q = cart[id] || 0;
  card.classList.toggle('inCart', q > 0);

  if (q === 0) {
    ctl.innerHTML = `<button class="add" aria-label="Добавить">+</button>`;
    ctl.querySelector('.add').onclick = e => add(id, e.currentTarget);
  } else {
    ctl.innerHTML = `
      <div class="stepper">
        <button data-a="-" aria-label="Убрать">−</button>
        <span class="qty">${q}</span>
        <button data-a="+" aria-label="Добавить">+</button>
      </div>`;
    ctl.querySelector('[data-a="-"]').onclick = () => setQty(id, q - 1);
    ctl.querySelector('[data-a="+"]').onclick = () => setQty(id, q + 1);
  }
}

/* Что предложить добавить: сначала лимонады, потом мелкие закуски */
const catItems = id => (MENU.find(c => c.id === id) || { items: [] }).items;
const hasCat   = id => catItems(id).some(it => cart[it.id]);
const hasDrink = () => hasCat('drinks');
const hasSauce = () => hasCat('sauces');
const hasPizza = () => hasCat('pizza');

function upsellItems() {
  const free = arr => arr.filter(it => !cart[it.id]);
  const drinks = free(catItems('drinks'));
  const sauces = free(catItems('sauces'));
  const snacks = free(catItems('snacks')).sort((a, b) => a.price - b.price);

  if (!hasDrink()) return drinks.concat(sauces, snacks).slice(0, 5);
  if (!hasSauce()) return sauces.concat(snacks, drinks).slice(0, 5);
  return snacks.concat(drinks, sauces).slice(0, 5);
}
/* Первая буква строчной — имя блюда встаёт в середину фразы */
const lower1 = t => t.charAt(0).toLowerCase() + t.slice(1);

/* Самое дешёвое дополнение, которого хватит до бесплатной доставки */
function freeCloser(gap) {
  const add = catItems('sauces').concat(catItems('drinks'), catItems('snacks'));
  return add
    .filter(it => !cart[it.id] && it.price >= gap)
    .sort((a, b) => a.price - b.price)[0] || null;
}

function upsellTitle() {
  if (!hasDrink() && hasPizza()) return 'К пицце — холодный лимонад?';
  if (!hasDrink()) return 'Добавить лимонад?';
  if (!hasSauce()) return 'Добавить соус?';
  return 'Добавить к заказу?';
}

    </div>`;

  if (!isOpenNow()) {
    html += `<div class="hint">Сейчас мы закрыты. Заказ можно оформить — примем его, как только откроемся, <b>${CONFIG.hoursText}</b>.</div>`;
  }

  if (form.mode !== 'pickup') {
    if (need > 0) {
      html += `<div class="hint">До минимального заказа не хватает <b>${rub(need)}</b>. Минимум для доставки — ${rub(CONFIG.delivery.min)}.</div>`;
    } else if (toFree > 0) {
      const c = freeCloser(toFree);
      html += c
        ? `<div class="hint">До бесплатной доставки не хватает <b>${rub(toFree)}</b>.
             Добавьте <b>${esc(lower1(c.name))}</b> за ${rub(c.price)} — и привезём бесплатно.
             <button class="hint-add" data-up="${c.id}">+ Добавить</button></div>`
        : `<div class="hint">Добавьте блюд на <b>${rub(toFree)}</b> — и доставка будет бесплатной.</div>`;
    }
  }

  const ups = upsellItems();
  if (ups.length) {
    html += `<div class="upsell">
      <div class="upsell-h">${upsellTitle()}</div>
      <div class="upsell-row">` +
      ups.map(it => `
        <div class="up-card">
          ${it.img
            ? `<img src="${it.img}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-icon',textContent:'${it.icon || '🍽️'}'}))">`
            : `<div class="card-icon">${it.icon || '🍽️'}</div>`}
          <div class="up-b">
            <div class="up-name">${esc(it.name)}</div>
            <div class="up-foot">
              <span class="up-price">${rub(it.price)}</span>
              <button class="up-add" data-up="${it.id}" aria-label="Добавить">+</button>
            </div>
          </div>
        </div>`).join('') +
      `</div></div>`;
  }

  html += `
    <div class="form">
      <div class="seg">
        <button data-mode="delivery" class="${form.mode === 'delivery' ? 'on' : ''}">🛵 Доставка</button>
        <button data-mode="pickup"   class="${form.mode === 'pickup'   ? 'on' : ''}">🚶 Самовывоз</button>
      </div>
      <div class="field" id="f-name"><label>Имя</label><input id="i-name" value="${esc(form.name)}" placeholder="Как к вам обращаться"></div>
      <div class="field" id="f-phone"><label>Телефон</label><input id="i-phone" type="tel" inputmode="tel" value="${esc(form.phone)}" placeholder="+7 ___ ___-__-__"></div>
      <div class="field ${form.mode === 'pickup' ? 'hidden' : ''}" id="f-street"><label>Адрес доставки</label><input id="i-street" value="${esc(form.street)}" placeholder="Улица, дом, квартира, этаж"></div>
      <div class="field"><label>Когда</label>
        <select id="i-time">
          <option value="asap">Как можно скорее</option>
          <option value="1h">Через час</option>
          <option value="2h">Через 2 часа</option>
          <option value="eve">К вечеру, созвонимся</option>
        </select>
      </div>
      <div class="field"><label>Оплата</label>
        <select id="i-pay">
          <option>Картой курьеру</option>
          <option>Наличными курьеру</option>
          <option>Переводом по телефону</option>
        </select>
      </div>
      <div class="field"><label>Комментарий</label><textarea id="i-note" placeholder="Без лука, позвонить за 10 минут…">${esc(form.note)}</textarea></div>
    </div>`;

  const keepScroll = sheetBody.scrollTop;
  sheetBody.innerHTML = html;
  sheetBody.scrollTop = keepScroll;

  /* степперы в корзине */
  sheetBody.querySelectorAll('[data-m]').forEach(b => b.onclick = () => setQty(b.dataset.m, cart[b.dataset.m] - 1));
  sheetBody.querySelectorAll('[data-p]').forEach(b => b.onclick = () => setQty(b.dataset.p, cart[b.dataset.p] + 1));

  /* правка состава комбо */
  sheetBody.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openDish(b.dataset.edit));

  /* апселл */
  sheetBody.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    const id = b.dataset.up;
    setQty(id, (cart[id] || 0) + 1);
    toast(ITEMS[id].name + ' — добавили');
  });

  /* переключатель доставка/самовывоз */
  sheetBody.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    form.mode = b.dataset.mode; saveForm(); paintSheet();
  });

  /* поля */
  const bind = (sel, key) => {
    const el = sheetBody.querySelector(sel);
    if (!el) return;
    el.oninput = el.onchange = () => {
      if (key === 'phone') el.value = maskPhone(el.value);
      form[key] = el.value;
      saveForm();
      el.closest('.field').classList.remove('err');
    };
  };
  bind('#i-name', 'name'); bind('#i-phone', 'phone'); bind('#i-street', 'street');
  bind('#i-time', 'time'); bind('#i-pay', 'pay'); bind('#i-note', 'note');
  sheetBody.querySelector('#i-time').value = form.time;
  sheetBody.querySelector('#i-pay').value  = form.pay;

  paintFoot(total);
}

function paintFoot(total) {
  const ch = CONFIG.channels;
  let html = '';

  const eta = form.mode === 'pickup' ? '' : ` · ${CONFIG.delivery.time.replace(' минут', ' мин')}`;
  if (ch.max) html += `<button class="send" id="sendMax">Заказать · ${rub(total)}${eta}</button>`;

  const row = [];
  if (ch.whatsapp) row.push(`<button class="send ghost" id="sendWa">WhatsApp</button>`);
  if (ch.sms)      row.push(`<button class="send ghost" id="sendSms">SMS</button>`);
  if (ch.call)     row.push(`<button class="send ghost" id="sendCall">Позвонить</button>`);
  row.push(`<button class="send ghost" id="sendCopy">Скопировать</button>`);

  if (!ch.max && row.length) {
    html += row.shift().replace('ghost', '').replace('</button>', ` · ${rub(total)}</button>`);
  }
  if (row.length) html += `<div class="send-row">${row.join('')}</div>`;

  html += `<p class="legal">Заказ подтверждаем звонком. Приём заказов ${CONFIG.hoursText}.</p>`;
  sheetFoot.innerHTML = html;

  const go = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  go('sendMax',  () => submit('max'));
  go('sendWa',   () => submit('wa'));
  go('sendSms',  () => submit('sms'));
  go('sendCall', () => submit('call'));
  go('sendCopy', () => submit('copy'));
}

/* ═══════════════════════════════════════════════════════════
   ТЕКСТ ЗАКАЗА + ОТПРАВКА
   ═══════════════════════════════════════════════════════════ */
const TIME_LABEL = { asap: 'как можно скорее', '1h': 'через час', '2h': 'через 2 часа', eve: 'к вечеру, созвониться' };

/* Телефон в вид +7 (918) 123-45-67 */
function maskPhone(v) {
  let d = String(v).replace(/\D/g, '');
  if (!d) return '';
  if (d[0] === '8' || d[0] === '9') d = '7' + (d[0] === '8' ? d.slice(1) : d);
  if (d[0] !== '7') d = '7' + d;
  d = d.slice(0, 11);
  let r = '+7';
  if (d.length > 1)  r += ' (' + d.slice(1, 4);
  if (d.length >= 5) r += ') ' + d.slice(4, 7);
  if (d.length >= 8) r += '-' + d.slice(7, 9);
  if (d.length >= 10) r += '-' + d.slice(9, 11);
  return r;
}

/* Сейчас принимаем заказы? */
function isOpenNow() {
  const n = new Date(), h = n.getHours() + n.getMinutes() / 60;
  return h >= CONFIG.hours.from && h < CONFIG.hours.to;
}

function orderText() {
  const sub = subtotal();
  const dlv = form.mode === 'pickup' ? 0 : deliveryCost();
  const lines = Object.entries(cart).map(([id, q], i) => {
    const it = ITEMS[id];
    const p = it.options ? `\n    (${pickText(id)})` : '';
    return `${i + 1}. ${it.name} — ${q} × ${rub(it.price)} = ${rub(it.price * q)}${p}`;
  });

  let t = `Здравствуйте! Хочу заказать в Bora Bora 🌺\n\n` + lines.join('\n') + `\n\n`;
  t += `Блюда: ${rub(sub)}\n`;
  t += form.mode === 'pickup' ? `Самовывоз\n` : `Доставка: ${dlv === 0 ? 'бесплатно' : rub(dlv)}\n`;
  t += `ИТОГО: ${rub(sub + dlv)}\n\n`;
  t += `Имя: ${form.name}\n`;
  t += `Телефон: ${form.phone}\n`;
  t += form.mode === 'pickup' ? `Самовывоз: ${CONFIG.address}\n` : `Адрес: ${form.street}\n`;
  t += `Когда: ${TIME_LABEL[form.time] || form.time}\n`;
  t += `Оплата: ${form.pay}\n`;
  if (form.note.trim()) t += `Комментарий: ${form.note.trim()}\n`;
  return t;
}

function validate() {
  let ok = true;
  const fail = sel => { const f = sheetBody.querySelector(sel); if (f) { f.classList.add('err'); ok = false; } };

  if (form.name.trim().length < 2) fail('#f-name');
  if (form.phone.replace(/\D/g, '').length < 10) fail('#f-phone');
  if (form.mode === 'delivery' && form.street.trim().length < 5) fail('#f-street');

  if (!ok) {
    toast('Заполните имя, телефон и адрес');
    const err = sheetBody.querySelector('.field.err input');
    if (err) { err.focus(); err.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    return false;
  }
  if (form.mode === 'delivery' && subtotal() < CONFIG.delivery.min) {
    toast('Минимальный заказ на доставку — ' + rub(CONFIG.delivery.min));
    return false;
  }
  return true;
}

function submit(channel) {
  if (!count()) return;

  if (channel === 'call') { location.href = 'tel:+' + CONFIG.phoneRaw; return; }
  if (!validate()) return;

  const text = orderText();
  const enc  = encodeURIComponent(text);
  saveLast();

  switch (channel) {
    case 'max':
      sendOrder(text, enc);
      break;
    case 'wa':
      window.open('https://wa.me/' + CONFIG.phoneRaw + '?text=' + enc, '_blank');
      break;
    case 'sms': {
      const sep = /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? '&' : '?';
      location.href = 'sms:+' + CONFIG.phoneRaw + sep + 'body=' + enc;
      break;
    }
    case 'copy':
      copy(text);
      break;
  }
}

/* Отправляем заказ боту в чат ресторана.
   Не получилось — откатываемся на экран «поделиться» в MAX. */
async function sendOrder(text, enc) {
  const btn = document.getElementById('sendMax');
  const shareFallback = () => { location.href = 'https://max.ru/:share?text=' + enc; };

  if (!CONFIG.orderEndpoint) { shareFallback(); return; }

  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Отправляем…'; }

  try {
    const r = await fetch(CONFIG.orderEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await r.json().catch(() => ({}));

    if (r.ok && data.ok) {
      cart = {};
      save();
      Object.keys(ITEMS).forEach(paintCard);
      paintBar();
      closeSheet();
      toast('Заказ принят! Перезвоним для подтверждения');
      return;
    }
    shareFallback();
  } catch (e) {
    shareFallback();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

function copy(text) {
  const done = () => toast('Заказ скопирован — вставьте в чат');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Не получилось скопировать'); }
  ta.remove();
}

/* ═══════════════════════════════════════════════════════════
   ИНФО, СТАТУС, ТОСТ, АНИМАЦИИ
   ═══════════════════════════════════════════════════════════ */
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

document.getElementById('callBtn').href = 'tel:+' + CONFIG.phoneRaw;

document.getElementById('badges').innerHTML = `
  <span class="badge">🛵 Доставка <b>${rub(CONFIG.delivery.price)}</b></span>
  <span class="badge">🎁 Бесплатно от <b>${rub(CONFIG.delivery.free)}</b></span>
  <span class="badge">⏱ <b>${CONFIG.delivery.time}</b></span>`;

document.getElementById('infoDelivery').innerHTML = `
  <p><span>Зона:</span> ${CONFIG.delivery.zone}</p>
  <p><span>Минимальный заказ:</span> ${rub(CONFIG.delivery.min)}</p>
  <p><span>Стоимость:</span> ${rub(CONFIG.delivery.price)}, бесплатно от ${rub(CONFIG.delivery.free)}</p>
  <p><span>Время:</span> ${CONFIG.delivery.time}</p>
  <p><span>Самовывоз:</span> без минимальной суммы</p>`;

document.getElementById('infoContacts').innerHTML = `
  <p><a href="tel:+${CONFIG.phoneRaw}">${CONFIG.phoneText}</a></p>
  <p>${CONFIG.address}</p>
  <p><a href="${CONFIG.mapUrl}" target="_blank" rel="noopener">Открыть на Яндекс.Картах →</a></p>
  <p><span>Заказы ${CONFIG.hoursText}</span></p>`;

/* Соцсети */
const SOC_ICON = {
  inst: `<svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <circle cx="17.3" cy="6.7" r="1.3" fill="currentColor"/></svg>`,
  max: `<svg viewBox="0 0 30 24" aria-hidden="true" style="width:26px">
      <text x="15" y="17" text-anchor="middle" fill="currentColor"
            font-family="Manrope, sans-serif" font-size="12" font-weight="800"
            letter-spacing="-.2">MAX</text></svg>`,
  vk: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor"
      d="M12.8 16.6h1.1s.33-.04.5-.22c.16-.16.15-.47.15-.47s-.02-1.3.58-1.5c.6-.19 1.36 1.26 2.17 1.82.61.42 1.08.33 1.08.33l2.17-.03s1.14-.07.6-.96c-.05-.07-.32-.66-1.6-1.85-1.35-1.25-1.17-1.05.45-3.22 1-1.32 1.4-2.12 1.27-2.47-.11-.33-.84-.24-.84-.24l-2.44.01s-.18-.02-.32.06c-.13.08-.21.27-.21.27s-.39 1.04-.91 1.93c-1.1 1.86-1.54 1.96-1.72 1.84-.42-.27-.31-1.07-.31-1.63 0-1.77.27-2.5-.52-2.7-.26-.06-.46-.1-1.13-.11-.87-.01-1.6 0-2.01.2-.28.14-.49.44-.36.46.16.02.53.1.73.36.25.34.24 1.11.24 1.11s.15 2.15-.35 2.42c-.34.18-.81-.19-1.79-1.89-.5-.87-.88-1.83-.88-1.83s-.07-.18-.2-.27c-.16-.12-.38-.15-.38-.15l-2.32.01s-.35.01-.48.16c-.11.14-.01.42-.01.42s1.82 4.16 3.88 6.26c1.89 1.92 4.03 1.8 4.03 1.8z"/></svg>`
};
const socEl = document.getElementById('socials');
[['inst', 'Instagram'], ['max', 'MAX'], ['vk', 'ВКонтакте']].forEach(([k, name]) => {
  const url = (CONFIG.social || {})[k];
  if (!url) return;
  const a = document.createElement('a');
  a.className = 'soc';
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.setAttribute('aria-label', name);
  a.innerHTML = SOC_ICON[k];
  socEl.appendChild(a);
});

document.getElementById('footText').innerHTML =
  `${CONFIG.address}<br>${CONFIG.phoneText} · Заказы ${CONFIG.hoursText}`;

/* Открыто / закрыто */
(function status() {
  const box = document.getElementById('statusBox');
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  const open = h >= CONFIG.hours.from && h < CONFIG.hours.to;
  box.innerHTML = open
    ? `<span class="status open"><span class="led"></span>Открыто · принимаем заказы до ${CONFIG.hours.to}:00</span>`
    : `<span class="status shut"><span class="led"></span>Сейчас закрыто · заказ примем ${CONFIG.hoursText.replace('с ', 'с ')}</span>`;
})();

/* Тост */
let toastT;
const toastEl = document.getElementById('toast');
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('on'), 2200);
}

/* Появление карточек */
const revealIO = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } });
}, { rootMargin: '0px 0px -6% 0px', threshold: .06 });
document.querySelectorAll('.card').forEach(c => revealIO.observe(c));

/* Активная категория при скролле */
const pills = document.querySelectorAll('.pill');
const sections = MENU.map(c => document.getElementById(c.id));
const navIO = new IntersectionObserver(es => {
  es.forEach(e => {
    if (!e.isIntersecting) return;
    const idx = sections.indexOf(e.target);
    if (idx < 0) return;
    pills.forEach((p, i) => p.classList.toggle('active', i === idx));
    pills[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  });
}, { rootMargin: '-25% 0px -60% 0px' });
sections.forEach(s => navIO.observe(s));

paintBar();

/* Кнопка «наверх» */
const toTop = document.getElementById('toTop');
toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
let topTick = false;
window.addEventListener('scroll', () => {
  if (topTick) return;
  topTick = true;
  requestAnimationFrame(() => {
    toTop.classList.toggle('on', window.scrollY > 700);
    topTick = false;
  });
}, { passive: true });
</script>
</body>
</html>
